name: Security and quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  interactive-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser-only product demo
        run: node scripts/check-demo.mjs

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java tests
        run: bash mvnw --batch-mode test

  memory-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install memory client test dependency
        run: python -m pip install httpx
      - name: Verify customer dataset isolation
        run: python -m unittest discover -s deploy/memory -p 'test_*.py' -v

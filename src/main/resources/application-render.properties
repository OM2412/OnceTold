# Explicit cloud profile: keep local H2 development unchanged.
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.jwt.secret=${APP_JWT_SECRET}
memory.service.base-url=http://127.0.0.1:8000

# Fail startup if a cloud schema statement is rejected.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Allow remote graph recall to finish before the chat model receives context.
memory.service.recall-timeout-ms=90000
